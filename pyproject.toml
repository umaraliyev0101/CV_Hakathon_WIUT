[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "showroom-coach"
version = "0.1.0"
description = "Camera-based coaching for car-showroom salespeople (WIUT Hackathon 2026, YAK-44)"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python>=4.9",
  "onnxruntime>=1.18",
  "supervision>=0.28,<0.31",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "imageio-ffmpeg>=0.5",
  "pyyaml>=6",
  "tqdm>=4.66",
  "httpx>=0.27",
]

[project.optional-dependencies]
eval = ["motmetrics>=1.4"]
dev = ["pytest>=8", "httpx>=0.27", "motmetrics>=1.4"]

[project.scripts]
showroom-coach = "showroom_coach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
showroom_coach = ["app/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs real models/video; skipped when files are missing"]
addopts = "-ra -m 'not slow'"
